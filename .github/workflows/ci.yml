name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: deno check agent-design-session.ts
      - run: deno lint agent-design-session.ts
      - run: sh -n agent-design-session.sh && sh -n test/smoke.sh
      - run: test/smoke.sh deno
      - run: test/smoke.sh node
